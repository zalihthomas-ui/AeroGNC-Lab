[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aerognc-lab"
version = "0.8.0"
description = "A modular flight dynamics, guidance, navigation and control verification platform"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "AeroGNC-Lab Contributors"}]
keywords = ["aerospace", "flight-dynamics", "gnc", "simulation", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "Pillow>=10,<13",
  "PyYAML>=6.0,<7",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
aerognc = "aerognc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aerognc"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib -ra"
testpaths = ["tests"]
markers = [
  "validation: independent or analytical validation tests",
  "slow: tests that run a simulation ensemble",
]

[tool.coverage.run]
branch = true
source = ["aerognc"]
# Tk event-loop wiring is exercised by a live-window smoke check; the mission
# planning, propagation, uncertainty, and plotting services behind it remain in
# automated branch coverage.
omit = [
  "*/aerognc/visualisation/mission_designer.py",
  "*/aerognc/visualisation/workbench.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
precision = 2

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
"src/aerognc/visualisation/mission_designer.py" = ["E501", "RUF001"]
"src/aerognc/project/report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["aerognc"]
