# Synthetic small-UAV plant for coefficient-driven waypoint validation.
metadata:
  name: Sparrow-X2 Fictional Civilian Research UAV
  fictional: true
  safety_scope: >-
    Fictional civilian research UAV using wholly synthetic geometry, coefficients,
    and mass properties for simulation-only guidance and control verification.

planet:
  name: Orbis-A
  gravitational_parameter_m3_s2: 3.9860044e+14
  radius_m: 6.371e+6
  j2: 1.08263e-3
  rotation_rate_radps: 7.292115e-5
  atmosphere_density_scale: 1.0

geometry:
  wing_area_m2: 1.8
  wingspan_m: 3.2
  mean_chord_m: 0.6
  aileron_limit_deg: 22.0
  elevator_limit_deg: 25.0
  rudder_limit_deg: 28.0
  control_time_constant_s: 0.12
  control_rate_limit_degps: 120.0
  throttle_time_constant_s: 0.6

mass:
  initial_mass_kg: 18.0
  dry_mass_kg: 12.0
  inertia_xx_kgm2: 1.6
  inertia_yy_kgm2: 2.4
  inertia_zz_kgm2: 3.2
  maximum_fuel_flow_kgps: 0.001

aerodynamics:
  backend: analytic
  cl_zero: 0.18
  cl_alpha_per_rad: 5.15
  cl_elevator_per_rad: 0.32
  cl_pitch_rate: 2.0
  cl_maximum: 1.42
  stall_angle_deg: 15.0
  post_stall_lift_fraction: 0.38
  cd_zero: 0.026
  induced_drag_factor: 0.052
  stall_drag_increment: 0.85
  side_force_beta_per_rad: -0.35
  side_force_aileron_per_rad: 0.01
  side_force_rudder_per_rad: 0.12
  roll_beta_per_rad: -0.06
  roll_rate: -0.08
  roll_yaw_rate: 0.04
  roll_aileron_per_rad: 0.05
  roll_rudder_per_rad: 0.015
  pitch_zero: 0.035
  pitch_alpha_per_rad: -1.05
  pitch_rate: -3.6
  pitch_elevator_per_rad: -0.25
  yaw_beta_per_rad: 0.08
  yaw_roll_rate: -0.02
  yaw_rate: -0.10
  yaw_aileron_per_rad: 0.005
  yaw_rudder_per_rad: -0.06

propulsion:
  maximum_thrust_n: 55.0
  thrust_density_exponent: 0.75
  maximum_operating_mach: 0.25
  maximum_operating_altitude_m: 5000.0
  rocket_assist_available: false
  rocket_thrust_n: 1.0
  rocket_specific_impulse_s: 100.0

initial_condition:
  latitude_deg: 0.0
  longitude_deg: 0.0
  altitude_m: 100.0
  true_airspeed_mps: 20.0
  heading_deg: 0.0
  flight_path_angle_deg: 0.0
  bank_angle_deg: 0.0
  angle_of_attack_deg: 2.5
  throttle: 0.28

environment:
  wind_north_mps: 0.0
  wind_east_mps: 0.0
  turbulence_std_north_mps: 0.0
  turbulence_std_east_mps: 0.0
  turbulence_std_down_mps: 0.0
  turbulence_correlation_time_s: 3.0
  random_seed: 218
  gust_start_time_s: 1000.0
  gust_duration_s: 1.0
  gust_north_mps: 0.0
  gust_east_mps: 0.0
  gust_down_mps: 0.0

simulation:
  duration_s: 900.0
  integration_step_s: 0.05
  output_step_s: 0.1

output_directory: ../results/waypoint_coefficient
