# Versioned, simulation-only coefficient-plant mission using truth-isolated ESKF navigation.
schema_version: 1

metadata:
  name: waypoint_demo_estimated_navigation
  safety_scope: >-
    Fictional civilian research-aircraft waypoint study using synthetic delayed
    sensors, internal simulation only, and no operational or real-vehicle output.
  fictional: true

mission_file: ../missions/waypoint_demo.mission.yaml
output_directory: results/waypoint_estimated

simulation:
  dt_s: 0.05
  max_time_s: 900.0
  initial_altitude_m: 100.0
  initial_airspeed_mps: 20.0

environment:
  wind_ned_mps: [0.0, 0.0, 0.0]
  gravity_mps2: 9.80665

navigation:
  mode: estimated
  estimated:
    seed: 31415
    initialization:
      position_error_std_m: [0.8, 0.8, 1.2]
      velocity_error_std_mps: [0.25, 0.25, 0.35]
      attitude_error_std_deg: [0.20, 0.20, 0.35]
      gyro_bias_estimate_radps: [0.0, 0.0, 0.0]
      accelerometer_bias_estimate_mps2: [0.0, 0.0, 0.0]
    sensors:
      gyroscope:
        sample_rate_hz: 20.0
        noise_std: [0.0020, 0.0020, 0.0020]
        constant_bias: [0.00040, -0.00030, 0.00025]
        bias_drift_std_per_sqrt_s: [0.000020, 0.000020, 0.000020]
        quantisation: [0.000001, 0.000001, 0.000001]
        delay_s: 0.0
        dropout_probability: 0.0
        dropout_intervals_s: []
      accelerometer:
        sample_rate_hz: 20.0
        noise_std: [0.030, 0.030, 0.030]
        constant_bias: [0.020, -0.015, 0.030]
        bias_drift_std_per_sqrt_s: [0.0010, 0.0010, 0.0010]
        quantisation: [0.001, 0.001, 0.001]
        delay_s: 0.0
        dropout_probability: 0.0
        dropout_intervals_s: []
      gnss:
        sample_rate_hz: 2.0
        noise_std: [1.2, 1.2, 2.0, 0.08, 0.08, 0.12]
        constant_bias: [0.15, -0.10, 0.20, 0.0, 0.0, 0.0]
        bias_drift_std_per_sqrt_s: [0.002, 0.002, 0.003, 0.0002, 0.0002, 0.0003]
        quantisation: [0.01, 0.01, 0.01, 0.001, 0.001, 0.001]
        delay_s: 0.15
        dropout_probability: 0.0
        dropout_intervals_s: [[70.0, 90.0]]
      barometer:
        sample_rate_hz: 10.0
        noise_std: [0.8]
        constant_bias: [0.3]
        bias_drift_std_per_sqrt_s: [0.010]
        quantisation: [0.05]
        delay_s: 0.10
        dropout_probability: 0.0
        dropout_intervals_s: []
      airspeed:
        sample_rate_hz: 10.0
        noise_std: [0.20]
        constant_bias: [0.10]
        bias_drift_std_per_sqrt_s: [0.003]
        quantisation: [0.02]
        delay_s: 0.0
        dropout_probability: 0.0
        dropout_intervals_s: []
    filter:
      initial_standard_deviation:
        position_m: [3.0, 3.0, 4.0]
        velocity_mps: [0.6, 0.6, 0.8]
        attitude_deg: [1.0, 1.0, 1.5]
        gyro_bias_radps: [0.002, 0.002, 0.002]
        accelerometer_bias_mps2: [0.08, 0.08, 0.08]
      process_noise:
        gyro_noise_std_radps_per_sqrt_hz: 0.00045
        accelerometer_noise_std_mps2_per_sqrt_hz: 0.0070
        gyro_bias_random_walk_std_radps2_per_sqrt_hz: 0.000020
        accelerometer_bias_random_walk_std_mps3_per_sqrt_hz: 0.0010
      fixed_lag_s: 1.0
      innovation_gate:
        gnss_nis_threshold: 30.0
        barometer_nis_threshold: 12.0
        degraded_after_rejections: 2
        failed_after_rejections: 5
    health:
      maximum_imu_age_s: 0.10
      maximum_gnss_age_s: 25.0
      maximum_airspeed_age_s: 0.50
      maximum_horizontal_position_std_m: 40.0
      maximum_vertical_position_std_m: 25.0

guidance:
  mode: vector_field
  vector_field_gain_per_m: 0.05
  vector_field_max_approach_deg: 80.0
  orbit_gain_per_m: 0.02
  l1_distance_m: 80.0
  altitude_error_to_climb_rate_per_s: 0.4
  max_climb_rate_mps: 6.0
  max_roll_feedforward_deg: 45.0

autopilot:
  course_kp: 1.2
  course_ki: 0.1
  altitude_kp_rad_per_m: 0.03
  altitude_ki: 0.002
  airspeed_kp: 0.06
  airspeed_ki: 0.02
  roll_kp: 1.6
  roll_rate_kd: 0.35
  pitch_kp: 2.2
  pitch_rate_kd: 0.4
  yaw_damper_kd: 0.5
  bank_limit_deg: 35.0
  pitch_limit_deg: 20.0
  integral_bank_limit_deg: 15.0
  integral_pitch_limit_deg: 10.0
  throttle_trim: 0.28
  throttle_delta_limit: 0.5
  elevator_trim: 0.10

safety:
  min_airspeed_mps: 12.0
  max_airspeed_mps: 45.0
  max_bank_deg: 60.0
  max_pitch_deg: 45.0
  min_altitude_m: 5.0
  max_altitude_m: 3000.0
  geofence_radius_m: 5000.0
  max_cross_track_m: 500.0

vehicle:
  backend: internal_coefficient
  aircraft_config: aircraft_waypoint_uav.yaml

actuators:
  aileron_limit_deg: 22.0
  elevator_limit_deg: 25.0
  rudder_limit_deg: 28.0
  surface_time_constant_s: 0.12
  surface_rate_limit_degps: 120.0
  throttle_time_constant_s: 0.6
  failures:
    aileron: none
    elevator: none
    rudder: none

hardware:
  allow_real_vehicle_output: false
