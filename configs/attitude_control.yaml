metadata:
  name: fictional_pitch_attitude_comparison
  safety_scope: >-
    Fictional civilian research-rocket attitude stabilisation benchmark using
    synthetic plant, actuator, and disturbance parameters.

simulation:
  step_s: 0.005
  duration_s: 8.0
  output_directory: results/attitude_control

command:
  time_s: 0.5
  reference_angle_deg: 8.0

disturbance:
  start_s: 4.5
  end_s: 4.75
  moment_nm: 1.0

plant:
  inertia_kgm2: 12.8
  passive_damping_nms: 0.15

actuator:
  time_constant_s: 0.06
  position_limit_deg: 12.0
  rate_limit_degps: 120.0
  command_delay_s: 0.03
  effectiveness_nm_per_rad: 25.0

cascaded_pid:
  rate_command_limit_radps: 1.0
  moment_command_limit_nm: 5.0
  attitude:
    kp: 1.8
    ki: 0.03
    kd: 0.01
    integral_limit: 0.4
    derivative_filter_tau_s: 0.03
  rate:
    kp: 40.0
    ki: 0.3
    kd: 0.02
    integral_limit: 1.0
    derivative_filter_tau_s: 0.02

state_feedback:
  # Continuous-time poles [rad/s], placed manually with Ackermann's formula.
  poles_radps: [-2.0, -2.8]
