name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src

  coverage:
    name: Full branch-aware coverage
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Test with branch-aware coverage
        run: >-
          pytest
          --cov=aerognc
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=75
      - name: Retain coverage record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: error

  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic unit suite
        run: pytest tests/unit -q
      - name: Smoke-test documented CLI
        run: >-
          python -m aerognc.cli run
          --config configs/three_dof_nominal.yaml
          --output results/ci-smoke
          --no-plots

  package:
    name: Build and clean-install package
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Clean-install wheel
        run: |
          python -m venv .package-smoke
          .package-smoke/bin/python -m pip install dist/*.whl
          .package-smoke/bin/python -m pip check
          .package-smoke/bin/python -c "import aerognc; from importlib.resources import files; assert files('aerognc').joinpath('py.typed').is_file(); print(aerognc.__version__)"
      - name: Retain distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
